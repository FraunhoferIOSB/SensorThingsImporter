name: Maven Build

on:
  push:
    branches:
      - master
      - develop
      - develop-*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21


    - name: Cache maven repository
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven


    - name: Build and Shade with Maven
      run: |
        mvn -B package -P shade
        echo "Exporting Variables"
        export PROJECT_NAME=$(mvn -Dexec.executable='echo' -Dexec.args='${project.build.finalName}' exec:exec -q)
        echo "JAR_FILE=${PROJECT_NAME}-shaded.jar" >> $GITHUB_ENV
        export version=$(mvn -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec -q)
        echo "DOCKER_TAG_FULL=${version}"          >> $GITHUB_ENV


    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4 
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build & Push Docker
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64
        context: "."
        push: true
        build-args: |
          JAR_FILE=${{ env.JAR_FILE }}
        tags: |
          fraunhoferiosb/frost-importer:${{ env.DOCKER_TAG_FULL }}
          fraunhoferiosb/frost-importer:latest
